# Copy to sshr.toml. Only url is required.

# The site to serve.
url = "https://example.com"

# Extra hosts sshr may fetch from, if your feed or pages live on another domain.
# A bare host allows ports 80 and 443; add ":port" for anything else. sshr
# fetches nothing outside this list and the site's own host.
# allowed_hosts = ["cdn.example.com", "feeds.example.com:8443"]

# How often to re-read the site, at least 1m, and how many posts and pages
# to keep.
# refresh = "15m"
# max_entries = 200
# How long one refresh may spend fetching pages. With a long Crawl-delay,
# pages past it are fetched in later refreshes.
# page_budget = "10m"

# listen = ":2222"
# host_key = ".sshr/host_ed25519"

# Limits for anonymous visitors.
# max_sessions = 200      # across everyone
# max_per_ip = 5          # concurrent, plus a burst of new sessions
# idle_timeout = "15m"    # "0s" for no limit
# max_session = "2h"      # "0s" for no limit

# Behind a load balancer that sends PROXY protocol headers. Connections from
# any other address are rejected.
# proxy_protocol = true
# trusted_proxies = ["10.0.0.0/8"]

# log_format = "json"     # or "text"

# Overrides for the site's manifest at /.well-known/sshr.json, field by field.
# The README's "Site manifest" section explains each field. A site you don't
# control can be set up the same way from here.
